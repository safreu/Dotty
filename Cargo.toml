[package]
name = "dotty"
version = "0.1.0"
edition = "2024"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
path-clean = "1.0.1"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
